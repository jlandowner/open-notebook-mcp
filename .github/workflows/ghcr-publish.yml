name: Publish container to GHCR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test with locked dependencies
        run: uv run --frozen pytest -q
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build image for publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: open-notebook-mcp:test
          labels: ${{ steps.meta.outputs.labels }}
      - name: Test real container and authenticated MCP over HTTP
        run: python scripts/container_e2e.py
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and print its digest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$IMAGE_TAGS"
          while IFS= read -r tag; do
            docker image tag open-notebook-mcp:test "$tag"
            docker image push "$tag"
          done <<< "$IMAGE_TAGS"
