# Example: deploy in the same namespace as Hermes and Open Notebook.
# Replace REPLACE_WITH_BUILD_DIGEST with the immutable digest from GHCR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-notebook-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-notebook-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-notebook-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/jlandowner/open-notebook-mcp@sha256:REPLACE_WITH_BUILD_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8000
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: MCP_PATH
              value: /mcp
            - name: STATELESS_HTTP
              value: "1"
            - name: JSON_RESPONSE
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MCP_ALLOWED_HOSTS
              value: "open-notebook-mcp,open-notebook-mcp.$(POD_NAMESPACE).svc,open-notebook-mcp.$(POD_NAMESPACE).svc.cluster.local"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: open-notebook-mcp-auth
                  key: token
            - name: OPEN_NOTEBOOK_URL
              value: http://open-notebook:5055
            - name: OPEN_NOTEBOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-notebook-auth
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: open-notebook-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-notebook-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      protocol: TCP
